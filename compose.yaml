name: swarmscope

services:
  postgres:
    image: postgres:17.10-bookworm
    environment:
      POSTGRES_USER: ${SWARMSCOPE_POSTGRES_USER:?Set SWARMSCOPE_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${SWARMSCOPE_POSTGRES_PASSWORD:?Set SWARMSCOPE_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${SWARMSCOPE_POSTGRES_DB:?Set SWARMSCOPE_POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${SWARMSCOPE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/local/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres-data:
