[project]
name = "hindsight"
version = "0.1.0"
description = "Counterfactual replay for agent swarms"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "cluster: requires a running local Kubernetes cluster",
    "spend: makes real model API calls",
]
addopts = "-m 'not cluster and not spend'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
